# =====================================================================================
# RustDesk custom build wrapper — TEMPLATE (generic, no real credentials inside)
#
# Copy to: .github/workflows/build-custom.yml in YOUR rustdesk fork, then:
#   1) build-windows-variants -> env: SCITER_RUST_VERSION / LLVM_VERSION / FLUTTER_VERSION
#      / VCPKG_COMMIT_ID / VERSION must match YOUR fork's flutter-build.yml env block.
#   2) flutter-build.yml needs the "Upload MSI" and "Upload unsigned APK (artifact)"
#      steps (see SKILL.md Step 4) or the release will miss .msi / .apk.
#   3) secrets RENDEZVOUS_SERVER / RELAY_SERVER / API_SERVER / RS_PUB_KEY /
#      FIXED_PASSWORD must be set on the fork.
#   4) Trigger: gh workflow run build-custom.yml --repo owner/rustdesk
#      (optionally -F release_name=custom). The release tag is rustdesk-YYYYMMDD (UTC)
#      unless release_name is provided.
#   5) SECURITY: the generated release notes are generic on purpose — never add server
#      / API / password / key to them; report those values to the user privately.
# =====================================================================================
name: Build Custom RustDesk

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release/tag name. Leave empty for rustdesk-YYYYMMDD (UTC)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  RENDEZVOUS_SERVER: "${{ secrets.RENDEZVOUS_SERVER }}"
  RELAY_SERVER: "${{ secrets.RELAY_SERVER }}"
  API_SERVER: "${{ secrets.API_SERVER }}"
  RS_PUB_KEY: "${{ secrets.RS_PUB_KEY }}"
  FIXED_PASSWORD: "${{ secrets.FIXED_PASSWORD }}"

jobs:
  # ============ 完整版：Windows 完整版(exe+msi) + Ubuntu(deb) + Android(apk) ============
  build-full:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: "custom-build"
    secrets: inherit

  # ============ Windows 定制版（仅被控 / 去升级完整版 / 去升级仅被控） ============
  build-windows-variants:
    if: ${{ !cancelled() }}
    needs: build-full
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant:
          # 仅被控（RustDesk 名）
          - { artifact: slave-artifact, appname: "", conn_type: "incoming", out: "rustdesk" }
          # 去升级完整版（rustdeskpro）
          - { artifact: noupdate-artifact, appname: "rustdeskpro", conn_type: "", out: "rustdeskpro" }
          # 去升级仅被控（rustdeskpro）
          - { artifact: noupdate-slave-artifact, appname: "rustdeskpro", conn_type: "incoming", out: "rustdeskpro" }
    env:
      APP_NAME: ${{ matrix.variant.appname }}
      CONN_TYPE: ${{ matrix.variant.conn_type }}
      SCITER_RUST_VERSION: "1.75"
      LLVM_VERSION: "15.0.6"
      FLUTTER_VERSION: "3.24.5"
      VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
      VERSION: "1.4.9"
      VCPKG_DEFAULT_HOST_TRIPLET: "x64-windows-static"
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code (fork, submodules recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      # rustdeskpro：把二进制改名为 rustdeskpro.exe，使快捷方式/卸载路径与 app_name 一致
      - name: Rename exe to match app name
        if: ${{ matrix.variant.appname == 'rustdeskpro' }}
        shell: bash
        run: |
          ls -la ./rustdesk/*.exe
          mv ./rustdesk/rustdesk.exe ./rustdesk/rustdeskpro.exe
          ls -la ./rustdesk/rustdeskpro.exe

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          if [ "${{ matrix.variant.appname }}" = "rustdeskpro" ]; then
            python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdeskpro.exe
          else
            python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          fi
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/${{ matrix.variant.out }}-${{ env.VERSION }}-x86_64.exe
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant.artifact }}
          path: ./SignOutput/*.exe

  # ============ 整理产物 + 方案1 分组说明 ============
  create-release:
    if: ${{ !cancelled() }}
    needs: [build-full, build-windows-variants]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rustdesk-*
          merge-multiple: true
          path: artifacts/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: slave-artifact
          path: slave/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: noupdate-artifact
          path: noupdate/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: noupdate-slave-artifact
          path: noupdate-slave/
        continue-on-error: true

      - name: Filter and rename artifacts
        shell: bash
        run: |
          set -e
          mkdir -p release
          # 1) 仅被控（RustDesk 名） -> windows-Slave-rustdesk-1.4.9-x86_64.exe
          for f in slave/*.exe; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            new="windows-Slave-$base"
            cp "$f" "release/$new"
            echo "Added: $new"
          done
          # 2) 去升级完整版 -> windows-rustdeskpro-1.4.9-x86_64.exe
          for f in noupdate/*.exe; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            new="windows-$base"
            cp "$f" "release/$new"
            echo "Added: $new"
          done
          # 3) 去升级仅被控 -> windows-Slave-rustdeskpro-1.4.9-x86_64.exe
          for f in noupdate-slave/*.exe; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            new="windows-Slave-$base"
            cp "$f" "release/$new"
            echo "Added: $new"
          done
          # 4) 完整版 exe+msi、deb、apk（来自 build-full）：exe/msi/deb 只留 x86_64，apk 全保留，去掉 rpm/dmg
          find artifacts/ -maxdepth 3 -type f -name "rustdesk-*" \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.apk" -o -name "*.rpm" -o -name "*.dmg" \) 2>/dev/null | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *.rpm)
                echo "Dropping rpm: $base"; continue ;;
              *.dmg)
                echo "Dropping macos dmg: $base"; continue ;;
              *.exe)
                case "$base" in
                  *x86_64*) new="windows-$base" ;;
                  *) echo "Dropping non-x64 exe: $base"; continue ;;
                esac ;;
              *.msi)
                case "$base" in
                  *x86_64*) new="windows-$base" ;;
                  *) echo "Dropping non-x64 msi: $base"; continue ;;
                esac ;;
              *.deb)
                case "$base" in
                  *x86_64*) new="ubuntu-$base" ;;
                  *) echo "Dropping non-x64 deb: $base"; continue ;;
                esac ;;
              *.apk)
                new="android-$base" ;;
            esac
            cp "$f" "release/$new"
            echo "Added: $new"
          done
          echo "=== Final release files ==="
          ls -lh release/ || true

      - name: Generate grouped release notes
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          if [ -n "${{ inputs.release_name }}" ]; then
            RELEASE_NAME="${{ inputs.release_name }}"
          else
            RELEASE_NAME="rustdesk-$(date +'%Y%m%d')"
          fi
          BASE="https://github.com/$REPO/releases/download/$RELEASE_NAME"
          # 单遍分类：遍历 release/ 全部文件，每个文件按文件名特征划分到恰好一个组
          # （不要用多个 glob 拼分组——exe/msi 名称一变就会漏放，见 SKILL.md 踩坑）
          rm -f /tmp/rdnote_*.txt
          for f in release/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            if [[ "$b" == windows-* ]]; then
              if [[ "$b" == *rustdeskpro* ]]; then
                tag="03_qu_shengji"
                if [[ "$b" == *Slave* ]]; then desc="仅被控（无升级提示）"; else desc="完整版（无升级提示）"; fi
              elif [[ "$b" == *Slave* ]]; then
                tag="02_jin_shoukong"; desc=""
              else
                tag="01_wan_zheng_ban"
                case "$b" in *.msi) desc="安装版";; *) desc="单文件版";; esac
              fi
            elif [[ "$b" == ubuntu-* ]]; then
              tag="04_ubuntu"; desc=""
            elif [[ "$b" == android-* ]]; then
              tag="05_android"
              case "$b" in *arm64*) desc="arm64";; *armv7*) desc="armv7";; *x86_64*) desc="x86_64";; *universal*) desc="universal";; *) desc="";; esac
            else
              tag="99_other"; desc=""
            fi
            echo "- [\`$b\`]($BASE/$b)${desc:+ — $desc}" >> "/tmp/rdnote_${tag}.txt"
          done
          {
            echo "# RustDesk 自定义版本"
            echo ""
            for entry in "01_wan_zheng_ban:Windows 完整版" "02_jin_shoukong:Windows 仅被控" "03_qu_shengji:Windows 去升级提示" "04_ubuntu:Ubuntu" "05_android:Android" "99_other:其他"; do
              tag="${entry%%:*}"; title="${entry##*:}"
              if [ -s "/tmp/rdnote_${tag}.txt" ]; then
                echo "## $title"
                echo ""
                cat "/tmp/rdnote_${tag}.txt"
                echo ""
              fi
            done
          } >> NOTES.md
          echo "=== NOTES.md ==="
          cat NOTES.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          if [ -n "${{ inputs.release_name }}" ]; then
            RELEASE_NAME="${{ inputs.release_name }}"
          else
            RELEASE_NAME="rustdesk-$(date +'%Y%m%d')"
          fi
          gh api -X DELETE "repos/$REPO/releases/tags/$RELEASE_NAME" 2>/dev/null || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/$RELEASE_NAME" 2>/dev/null || true
          gh api -X DELETE "repos/$REPO/releases/tags/custom-build" 2>/dev/null || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/custom-build" 2>/dev/null || true
          if ls release/* >/dev/null 2>&1; then
            gh release create "$RELEASE_NAME" release/* \
              --repo "$REPO" \
              --title "$RELEASE_NAME" \
              --notes-file NOTES.md \
              --prerelease
            echo "Release created: $RELEASE_NAME"
          else
            echo "No artifacts to publish!"
            exit 1
          fi
